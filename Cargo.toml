[workspace]
members = ["crates/tinyimg-core", "crates/tinyimg-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
authors = ["tinyimg contributors"]
repository = "https://github.com/cyclops-top/tiny-image"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.8"
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Portable candidate-only AVIF verification; see vendor/avif-decode/TINYIMG-PATCHES.md.
[patch.crates-io]
avif-decode = { path = "vendor/avif-decode" }

[profile.dev.package.rav1d]
opt-level = 2
debug-assertions = false

[profile.dev.package.rav1e]
opt-level = 2
